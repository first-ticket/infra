version: '3.8'

services:

  postgresql:
    image: postgres:16
    container_name: first-ticket-postgres
    restart: on-failure:3
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - first-ticket-network

  redis:
    image: redis:7.2-alpine
    container_name: first-ticket-redis
    restart: on-failure:3
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - first-ticket-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: first-ticket-kafka
    restart: on-failure:3
    ports:
      - "${KAFKA_PORT:-9092}:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 120s
    networks:
      - first-ticket-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: first-ticket-kafka-ui
    restart: on-failure:3
    ports:
      - "${KAFKA_UI_PORT:-8989}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: first-ticket
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - first-ticket-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: first-ticket-keycloak
    restart: on-failure:3
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - keycloak-data:/opt/keycloak/data
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    networks:
      - first-ticket-network

  # ── 모니터링 ──────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: first-ticket-prometheus
    restart: on-failure:3
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - first-ticket-network

  grafana:
    image: grafana/grafana:10.4.0
    container_name: first-ticket-grafana
    restart: on-failure:3
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - first-ticket-network

  zipkin:
    image: openzipkin/zipkin:3.4
    container_name: first-ticket-zipkin
    restart: on-failure:3
    ports:
      - "${ZIPKIN_PORT:-9411}:9411"
    environment:
      STORAGE_TYPE: mem          # 운영 전환 시 elasticsearch 등으로 교체
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9411/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - first-ticket-network


  # ── 부하테스트 ──────────────────────────────────────────────

  ngrinder-controller:
    image: ngrinder/controller:3.5.9-p1
    platform: linux/amd64
    container_name: first-ticket-ngrinder-controller
    ports:
      - "${NGRINDER_PORT:-8090}:80"
      - "16001:16001"
      - "12000-12009:12000-12009"
    networks:
      - first-ticket-network

  ngrinder-agent:
    image: ngrinder/agent:3.5.9-p1
    platform: linux/amd64
    container_name: first-ticket-ngrinder-agent
    command: ngrinder-controller:80
    depends_on:
      - ngrinder-controller
    networks:
      - first-ticket-network

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  keycloak-data:
  prometheus-data:
  grafana-data:
  ngrinder-controller-data:

networks:
  first-ticket-network:
    name: first-ticket-network
    driver: bridge
